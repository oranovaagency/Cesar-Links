<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Cesar Food · سيزر · Liens</title>
<meta name="description" content="Tous les liens de Cesar Food, restaurant syrien à Oran : menu, avis Google, appel, itinéraire.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Bebas+Neue&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Cesar Food links page (opened from the NFC card / QR). Same look as the Cesar menu: black, red, mustard. */
  :root { --bk: #111; --bk2: #1B1B1B; --bk3: #262626; --muted: #B9B4AA; --red: #D9262E; --mus: #F2A922; --line: rgba(255,255,255,.12); --body: "Cairo", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bk); color: #fff; font: 600 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; min-height: 100vh; }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--mus); outline-offset: 3px; }
  .wrap { max-width: 520px; margin-inline: auto; padding-inline: 16px; }
  .bg { position: fixed; inset: 0; z-index: -1; }
  .bg img { width: 100%; height: 100%; object-fit: cover; }
  .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(17,17,17,.55), rgba(17,17,17,.88) 45%, rgba(17,17,17,.94)); }

  header { text-align: center; padding: 22px 0 6px; position: relative; }
  .lang { position: absolute; top: 16px; inset-inline-end: 0; height: 38px; min-width: 52px; padding: 0 14px; border-radius: 999px; background: rgba(17,17,17,.7); border: 1px solid rgba(255,255,255,.3); font: 800 14px/1 var(--body); }
  .avatar { width: 112px; height: 112px; margin: 18px auto 0; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 4px var(--red), 0 0 0 9px rgba(17,17,17,.8), 0 0 0 10px rgba(242,169,34,.5); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  .ar-logo { font: 400 58px/1 "Lalezar", sans-serif; margin-top: 14px; }
  .logo { display: inline-flex; flex-direction: column; align-items: center; font: 400 42px/.9 "Bebas Neue", sans-serif; letter-spacing: .12em; direction: ltr; }
  .logo i { font: 800 12px/1 var(--body); font-style: normal; background: var(--red); padding: 3px 9px 4px; border-radius: 999px; margin-top: 3px; }
  .kind { color: var(--mus); font-weight: 800; margin-top: 8px; }
  .stars { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 5px 12px; border-radius: 999px; background: var(--bk2); border: 1px solid var(--line); font-size: 13px; font-weight: 700; }
  .stars b { color: var(--mus); }

  .links { display: grid; gap: 12px; margin-top: 24px; }
  .menu-card { position: relative; display: block; height: 190px; border-radius: 20px; overflow: hidden; box-shadow: 0 16px 34px -18px rgba(217,38,46,.7); }
  .menu-card img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
  .menu-card:hover img { transform: scale(1.04); }
  .menu-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, rgba(17,17,17,.92)); }
  .menu-card .t { position: absolute; z-index: 1; inset: auto 18px 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .menu-card .brush { display: inline-block; position: relative; isolation: isolate; font: 400 34px/1.1 "Lalezar", sans-serif; color: var(--bk); padding: 4px 18px 2px; }
  [dir="ltr"] .menu-card .brush { font-family: "Bebas Neue", sans-serif; letter-spacing: .04em; }
  .menu-card .brush::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--mus); border-radius: 4px 14px 6px 18px; transform: skew(-6deg) rotate(-1deg); }
  .menu-card small { display: block; color: #EDE8DD; font-size: 14px; margin-top: 4px; }
  .menu-card .go { width: 48px; height: 48px; border-radius: 50%; background: var(--red); display: grid; place-items: center; flex: none; }
  .menu-card .go svg, .link .go { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  [dir="rtl"] .go svg, [dir="rtl"] .link .go { transform: scaleX(-1); }

  .link { display: flex; align-items: center; gap: 14px; min-height: 70px; padding: 10px 14px; border-radius: 18px; background: rgba(27,27,27,.94); border: 1px solid var(--line); transition: transform .2s, border-color .2s; }
  .link:hover { transform: translateY(-2px); border-color: rgba(242,169,34,.6); }
  .link .ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--bk3); }
  .link .ic svg { width: 24px; height: 24px; }
  .link .tx { flex: 1; min-width: 0; }
  .link b { display: block; font: 800 17px/1.25 var(--body); }
  .link small { display: block; color: var(--muted); font-size: 13.5px; }
  .link .go { color: var(--muted); flex: none; }
  [dir="rtl"] .link .num { text-align: right; }
  .link.review { border-color: rgba(242,169,34,.55); background: linear-gradient(90deg, rgba(242,169,34,.16), rgba(27,27,27,.94) 70%); }
  [dir="rtl"] .link.review { background: linear-gradient(270deg, rgba(242,169,34,.16), rgba(27,27,27,.94) 70%); }
  .link.review .ic { background: var(--mus); }
  .link.call .ic { background: var(--red); }
  .link.fb .ic { background: #1877F2; }

  .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 22px; }
  .strip img { aspect-ratio: 1; object-fit: cover; border-radius: 12px; width: 100%; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .tools button { min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; background: rgba(27,27,27,.94); border: 1px solid var(--line); font: 800 14px/1.2 var(--body); }
  .tools svg { width: 20px; height: 20px; fill: none; stroke: var(--mus); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  footer { text-align: center; padding: 26px 0 calc(30px + env(safe-area-inset-bottom)); }
  footer p { color: var(--muted); font-size: 13px; }
  .credit { display: inline-flex; align-items: center; gap: 7px; margin-top: 14px; direction: ltr; opacity: .8; }
  .credit span { font: 600 10px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .credit img { height: 14px; width: auto; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--mus); color: var(--bk); font-weight: 800; padding: 10px 18px; border-radius: 999px; transition: .3s; pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .menu-card img, .link, .toast { transition: none; } }
</style>
</head>
<body>

    <p class="kind" data-i="kind">ماكولات سورية · وهران</p>

  </header>

  <main class="links">

      <img src="img/plats.webp" alt="">

    <a class="link review" href="https://search.google.com/local/writereview?placeid=ChIJLQkqHvOJfg0RyTQ611OjYno" target="_blank" rel="noopener">

      <span class="tx"><b data-i="rev">قيّمنا على Google</b><small data-i="revSub">رأيك يهمّنا ★★★★★</small></span>

    <a class="link call" href="tel:+213555658870">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/></svg></span>
      <span class="tx"><b data-i="call">اتصل بنا</b><small class="num" dir="ltr">0555 65 88 70</small></span>
      <svg class="go" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <a class="link" href="tel:+213541327466">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/></svg></span>
      <span class="tx"><b data-i="call2">اتصل بنا</b><small class="num" dir="ltr">0541 32 74 66</small></span>
      <svg class="go" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <a class="link fb" href="https://www.facebook.com/profile.php?id=100063766110231" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24" fill="#fff"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4a21 21 0 0 0-2.3-.1c-2.3 0-3.9 1.4-3.9 4v2.2H7.8v3h2.6V21Z"/></svg></span>
      <span class="tx"><b>Facebook</b><small dir="ltr" class="num">Cesar Food</small></span>
      <svg class="go" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>

    <a class="link" href="https://www.google.com/maps/search/?api=1&query=C%C3%A9sar%20restaurant%20Oran&query_place_id=ChIJLQkqHvOJfg0RyTQ611OjYno" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#F2A922" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span>
      <span class="tx"><b data-i="route">الاتجاهات</b><small data-i="addr">شارع هاروني بوزيان، وهران</small></span>
      <svg class="go" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </main>

  <div class="strip" aria-hidden="true"><img src="img/shawarma.webp" alt=""><img src="img/mashawi.webp" alt=""><img src="img/mexicano.webp" alt=""><img src="img/broche.webp" alt=""></div>

  <div class="tools">
    <button type="button" id="save"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span data-i="save">حفظ الرقم</span></button>
    <button type="button" id="share"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg><span data-i="share">مشاركة</span></button>
  </div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const T = {
  ar: { kind: "ماكولات سورية · وهران", menu: "شوف المنيو", menuSub: "شاورما، مشاوي، مكسيكانو، برغر…", rev: "قيّمنا على Google", revSub: "رأيك يهمّنا ★★★★★",
        call: "اتصل بنا", call2: "خط ثاني", route: "الاتجاهات", addr: "شارع هاروني بوزيان، وهران", save: "حفظ الرقم", share: "مشاركة", foot: "سيزر · ماكولات سورية · وهران",
        langBtn: "FR", copied: "تم نسخ الرابط", saved: "تم تحميل جهة الاتصال" },
  fr: { kind: "Saveurs syriennes · Oran", menu: "Voir le menu", menuSub: "Chawarma, grillades, mexicano, burgers…", rev: "Laisser un avis Google", revSub: "Votre avis compte ★★★★★",
        call: "Appeler", call2: "Deuxième ligne", route: "Itinéraire", addr: "Rue Harouni Bouziane, Oran", save: "Enregistrer le numéro", share: "Partager", foot: "Cesar Food · Saveurs syriennes · Oran",
        langBtn: "عربي", copied: "Lien copié", saved: "Contact téléchargé" }
};
let lang = "ar";
try { if (localStorage.getItem("cesar-lang") === "fr") lang = "fr"; } catch (e) {}
function apply() {
  const t = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(el => { if (t[el.dataset.i]) el.textContent = t[el.dataset.i]; });
  document.getElementById("lang").textContent = t.langBtn;
}
document.getElementById("lang").addEventListener("click", () => { lang = lang === "ar" ? "fr" : "ar"; try { localStorage.setItem("cesar-lang", lang); } catch (e) {} apply(); });
const toast = (m) => { const el = document.getElementById("toast"); el.textContent = m; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 1800); };
document.getElementById("save").addEventListener("click", () => {
  const v = ["BEGIN:VCARD", "VERSION:3.0", "FN:Cesar Food سيزر", "ORG:Cesar Food", "TEL;TYPE=CELL:+213555658870", "TEL;TYPE=CELL:+213541327466", "X-SOCIALPROFILE;TYPE=facebook:https://www.facebook.com/profile.php?id=100063766110231", "ADR;TYPE=WORK:;;Rue Harouni Bouziane;Oran;;;Algérie", "URL:https://cesar-food-oran.netlify.app/", "END:VCARD"].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([v], { type: "text/vcard" })); a.download = "Cesar-Food.vcf"; a.click(); toast(T[lang].saved);
});
document.getElementById("share").addEventListener("click", async () => {
  const data = { title: "Cesar Food · سيزر", url: location.href };
  if (navigator.share) { try { await navigator.share(data); } catch (e) {} }
  else { try { await navigator.clipboard.writeText(location.href); toast(T[lang].copied); } catch (e) {} }
});
apply();
</script>
</body>
</html>
